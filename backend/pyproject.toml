[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.ruff]
indent-width = 2
line-length = 150
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["entities", "services", "routers", "repositories", "database"]

[tool.ruff.format]
indent-style = "space"
