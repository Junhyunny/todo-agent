[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
omit = ["src/export_spec.py", "src/conftest.py", "src/**/test_*.py"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.14"
strict = true

[tool.ruff]
indent-width = 2
line-length = 150
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["entities", "services", "routers", "repositories", "database"]

[tool.ruff.format]
indent-style = "space"
